<html>
    <head>
        <title>Saves</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
        <style>
            body { margin: 0; }
            #nav_bar { width: 200px; position: fixed; left: 0; top: 0; bottom: 0; background: #1f2937; overflow-y: auto; }
            .nav_body { margin-left: 200px; padding: 2rem; }
            .error-msg { color: #c00; }
            .pagination { margin-top: 1rem; }
        </style>
    </head>
    <body>
        <div id='nav_bar'></div>
        <div class='nav_body'>
            <h1>Saves</h1>
            <p id="p_error" class="error-msg" style="display:none"></p>
            <table class="pure-table pure-table-horizontal" style="width:100%;">
                <thead>
                    <tr>
                        <th>ID <a id="sort_id_link">Sort</a></th>
                        <th>User ID</th>
                        <th>Profile ID</th>
                        <th>Game Meta ID</th>
                        <th>Name</th>
                        <th>Source Device</th>
                        <th>File Size</th>
                        <th>Date <a id="sort_date_link">Sort</a></th>
                        <th>Created <a id="sort_created_at_link">Sort</a></th>
                        <th>Updated <a id="sort_updated_at_link">Sort</a></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table"></tbody>
            </table>
            <div class="pagination">
                <a id="prev_link" style="display:none">Previous</a>
                <span id="page_text"></span>
                <a id="next_link" style="display:none">Next</a>
            </div>
        </div>
    </body>
</html>
