<html>
    <head>
        <title>Delete Save</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div>
            <div id='nav_bar'></div>
            <div class='nav_body'>
                <h1>Delete Save</h1>
                <p>Are you sure you want to delete this save?</p>
                <ul>
                    <li>ID: <span id="save_id"></span></li>
                    <li>User ID: <span id="user_id"></span></li>
                    <li>Profile ID: <span id="profile_id"></span></li>
                    <li>Game Meta ID: <span id="game_meta_id"></span></li>
                    <li>Name: <span id="name"></span></li>
                </ul>
                <form id="delete_form" action="/saves" method="POST" enctype="application/x-www-form-urlencoded">
                    <button type="submit">Delete Save</button>
                </form>
                <p>
                    <a id="cancel_link" href="/saves">Cancel</a>
                </p>
            </div>
        </div>
    </body>
</html>
