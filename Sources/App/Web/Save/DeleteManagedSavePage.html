<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Save — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <h1>Delete Save</h1>
        <p>Are you sure you want to delete this save?</p>
        <ul>
            <li>ID: <span id="save_id"></span></li>
            <li>User ID: <span id="user_id"></span></li>
            <li>Profile ID: <span id="profile_id"></span></li>
            <li>Game Meta ID: <span id="game_meta_id"></span></li>
            <li>Name: <span id="name"></span></li>
        </ul>
        <form id="delete_form" action="/saves" method="POST" enctype="application/x-www-form-urlencoded" class="pure-form">
            <button type="submit" class="pure-button btn-danger">Delete Save</button>
            <a id="cancel_link" href="/saves" class="pure-button" style="margin-left:0.5rem;">Cancel</a>
        </form>
    </div>
</body>
</html>
