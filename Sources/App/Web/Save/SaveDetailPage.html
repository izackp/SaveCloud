<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Detail — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <h1 style="margin-bottom:1.5rem;">Save Detail</h1>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <table class="pure-table pure-table-bordered" style="max-width:600px;">
            <tbody>
                <tr><th>ID</th><td><span id="save_id"></span></td></tr>
                <tr><th>User ID</th><td><span id="user_id"></span></td></tr>
                <tr><th>Profile ID</th><td><span id="profile_id"></span></td></tr>
                <tr><th>Game Meta ID</th><td><a id="game_meta_id_link"><span id="game_meta_id"></span></a></td></tr>
                <tr><th>Game Hash ID</th><td><span id="game_hash_id"></span></td></tr>
                <tr><th>Compatibility ID</th><td><span id="compatibility_id"></span></td></tr>
                <tr><th>Sequential ID</th><td><span id="sequential_id"></span></td></tr>
                <tr><th>Name</th><td><span id="name"></span></td></tr>
                <tr><th>URL</th><td><span id="url"></span></td></tr>
                <tr><th>File Size</th><td><span id="file_size"></span></td></tr>
                <tr><th>Source Device</th><td><span id="source_device"></span></td></tr>
                <tr><th>Content Hash</th><td><code id="content_hash"></code></td></tr>
                <tr><th>Notes</th><td><span id="notes"></span></td></tr>
                <tr><th>Date</th><td><span id="date"></span></td></tr>
                <tr><th>Created</th><td><span id="created_at"></span></td></tr>
                <tr><th>Updated</th><td><span id="updated_at"></span></td></tr>
            </tbody>
        </table>
        <p style="margin-top:1.5rem;"><a id="back_link">&#8592; Back to Saves</a></p>
    </div>
</body>
</html>
