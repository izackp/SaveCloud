<form action="/login"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
  <fieldset>
    <label>
      Username or Email
      <input type="text"
             name="email_or_username"
             required
             autofocus
             autocomplete="off">
    </label>

    <label>
      Password
      <input type="password"
             name="password"
             class="password-input"
             required
             minlength="8"
             pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
             title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
    </label>

    <button type="submit" class="pure-button pure-button-primary" style="margin-top:0.75rem; width:100%;">Login</button>
  </fieldset>
</form>
