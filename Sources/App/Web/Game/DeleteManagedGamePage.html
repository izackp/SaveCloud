<html>
    <head>
        <title>Delete Game</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
        <style>
            body { margin: 0; }
            #nav_bar { width: 200px; position: fixed; left: 0; top: 0; bottom: 0; background: #1f2937; overflow-y: auto; }
            .nav_body { margin-left: 200px; padding: 2rem; max-width: 760px; }
            .danger-button { background: #c00; color: #fff; }
        </style>
    </head>
    <body>
        <div id='nav_bar'></div>
        <div class='nav_body'>
            <h1>Delete Game</h1>
            <p>Are you sure you want to delete this game?</p>
            <ul>
                <li>ID: <span id="game_id"></span></li>
                <li>Name: <span id="name"></span></li>
                <li>Version: <span id="version"></span></li>
                <li>Base Game ID: <span id="base_game_id"></span></li>
            </ul>
            <form id="delete_form" action="/games" method="POST" enctype="application/x-www-form-urlencoded" class="pure-form pure-form-stacked">
                <label for="replace_with_parent" class="pure-checkbox">
                    <input type="checkbox" id="replace_with_parent" name="replace_with_parent">
                    Replace dependents with parent
                </label>
                <label for="allow_break" class="pure-checkbox">
                    <input type="checkbox" id="allow_break" name="allow_break">
                    Allow dependents to lose their relation
                </label>
                <button type="submit" class="pure-button danger-button" style="margin-top:0.75rem;">Delete Game</button>
            </form>
            <p style="margin-top:1rem;">
                <a id="cancel_link" href="/games">Cancel</a>
            </p>
        </div>
    </body>
</html>
