<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Game — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <h1>Delete Game</h1>
        <p>Are you sure you want to delete this game?</p>
        <ul>
            <li>ID: <span id="game_id"></span></li>
            <li>Name: <span id="name"></span></li>
            <li>Version: <span id="version"></span></li>
            <li>Base Game ID: <span id="base_game_id"></span></li>
        </ul>
        <form id="delete_form" action="/games" method="POST" enctype="application/x-www-form-urlencoded" class="pure-form pure-form-stacked" style="max-width:400px;">
            <label for="replace_with_parent" class="pure-checkbox" style="font-weight:400;">
                <input type="checkbox" id="replace_with_parent" name="replace_with_parent">
                Replace dependents with parent
            </label>
            <label for="allow_break" class="pure-checkbox" style="font-weight:400;">
                <input type="checkbox" id="allow_break" name="allow_break">
                Allow dependents to lose their relation
            </label>
            <div style="margin-top:1rem;">
                <button type="submit" class="pure-button btn-danger">Delete Game</button>
                <a id="cancel_link" href="/games" class="pure-button" style="margin-left:0.5rem;">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
