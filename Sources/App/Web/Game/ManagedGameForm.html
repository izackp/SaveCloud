<form action="/games"
      method="POST"
      enctype="application/x-www-form-urlencoded">
  <fieldset>
    <h2>Manage Game</h2>

    <label>
      Game ID:
      <span id="game_id"></span><br>
    </label>

    <label for="name">
      Name:
      <input
        type="text"
        id="name"
        name="name"
        required
        autofocus
        autocomplete="off"><br>
    </label>

    <label for="version">
      Version:
      <input
        type="text"
        id="version"
        name="version"
        autocomplete="off"><br>
    </label>

    <label for="family_id">
      Family ID:
      <input
        type="text"
        id="family_id"
        name="family_id"
        autocomplete="off"><br>
    </label>

    <label for="base_game_id">
      Base Game ID:
      <input
        type="text"
        id="base_game_id"
        name="base_game_id"
        autocomplete="off"><br>
    </label>

    <label for="hashed_file_name">
      Hashed File Name:
      <input
        type="text"
        id="hashed_file_name"
        name="hashed_file_name"
        autocomplete="off"><br>
    </label>

    <label for="xxhash64">
      xxHash64:
      <input
        type="text"
        id="xxhash64"
        name="xxhash64"
        autocomplete="off"><br>
    </label>

    <label for="breaks_save_format_from_previous_version">
      Breaks Save Format From Previous Version:
      <input
        type="checkbox"
        id="breaks_save_format_from_previous_version"
        name="breaks_save_format_from_previous_version"><br>
    </label>

    <label for="breaks_save_format_from_base_game">
      Breaks Save Format From Base Game:
      <input
        type="checkbox"
        id="breaks_save_format_from_base_game"
        name="breaks_save_format_from_base_game"><br>
    </label>

    <label>
      Created At:
      <span id="created_at"></span><br>
    </label>

    <label>
      Updated At:
      <span id="updated_at"></span><br>
    </label>

    <label id="error_container" style="display:none">
      Error:
      <span id="span_error"></span><br>
    </label>

    <button type="submit">Update Game</button>
  </fieldset>
</form>
