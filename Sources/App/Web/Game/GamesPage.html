<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <h1 style="margin-bottom:1.5rem;">Games</h1>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <table class="pure-table pure-table-horizontal">
            <thead>
                <tr>
                    <th>ID <a id="sort_id_link">&#8597;</a></th>
                    <th>Name <a id="sort_name_link">&#8597;</a></th>
                    <th>Version</th>
                    <th>Family ID</th>
                    <th>Base Game ID</th>
                    <th>Breaks Prev</th>
                    <th>Breaks Base</th>
                    <th>Created <a id="sort_created_at_link">&#8597;</a></th>
                    <th>Updated <a id="sort_updated_at_link">&#8597;</a></th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table"></tbody>
        </table>
        <div class="pagination">
            <a id="prev_link" style="display:none">&#8592; Previous</a>
            <span id="page_text"></span>
            <a id="next_link" style="display:none">Next &#8594;</a>
        </div>
    </div>
</body>
</html>
