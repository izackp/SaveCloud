<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Create Account</h1>
        <form action="/register"
            method="POST"
            enctype="application/x-www-form-urlencoded"
            class="pure-form pure-form-stacked">
            <fieldset>
                <label for="reg_username">Username</label>
                <input type="text"
                    id="reg_username"
                    name="username"
                    class="pure-input-1"
                    required
                    autofocus
                    autocomplete="off">

                <label for="reg_email" style="margin-top:0.75rem;">Email</label>
                <input type="email"
                    id="reg_email"
                    name="email"
                    class="pure-input-1"
                    required>

                <label for="reg_password" style="margin-top:0.75rem;">Password</label>
                <input type="password"
                    id="reg_password"
                    name="password"
                    class="pure-input-1 password-input"
                    required
                    minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">

                <label for="reg_password_confirm" style="margin-top:0.75rem;">Re-enter Password</label>
                <input type="password"
                    id="reg_password_confirm"
                    name="password_confirmation"
                    class="pure-input-1 password-input"
                    required
                    minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">

                <button type="submit" class="pure-button pure-button-primary pure-input-1" style="margin-top:1rem;">Register</button>
            </fieldset>
        </form>
        <p id="error_text" class="error-msg"></p>
    </div>
</body>
</html>
