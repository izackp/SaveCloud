<html>
    <head>
        <title>Registration</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="content">
            <form action="/register"
                method="POST"
                enctype="application/x-www-form-urlencoded">
                <fieldset>
                    <label>
                        Username
                        <input type="text"
                            name="username"
                            required
                            autofocus
                            autocomplete="off">
                    </label>
                    
                    <label>
                        Email
                        <input type="text"
                            name="email"
                            required>
                    </label>
                    
                    <label class="password-label">
                        Password
                        <input type="password"
                            name="password"
                            class="password-input"
                            required
                            minlength="8"
                            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                            title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    </label>
                    
                    <label class="password-label">
                        Re-enter Password
                        <input type="password"
                            name="password_confirmation"
                            class="password-input"
                            required
                            minlength="8"
                            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                            title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
                    </label>
                    
                    <button type="submit">Register</button>
                </fieldset>
            </form>
            <p id="error_text"></p>
        </div>
    </body>
</html>
