<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Saves — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
    <script src="https://cdn.jsdelivr.net/npm/jdenticon@3.3.0/dist/jdenticon.min.js" async
        integrity="sha384-LfouGM03m83ArVtne1JPk926e3SGD0Tz8XHtW2OKGsgeBU/UfR0Fa8eX+UlwSSAZ"
        crossorigin="anonymous"></script>
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a id="breadcrumb_root_link"><span id="breadcrumb_root_label"></span></a>
            <span aria-hidden="true">/</span>
            <a id="breadcrumb_profile_link"><span id="breadcrumb_profile_name"></span></a>
            <span aria-hidden="true">/</span>
            <span id="breadcrumb_game_name"></span>
        </nav>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <section class="profile-game-detail-hero">
            <div>
                <h1 class="profile-game-detail-title">
                    <span id="game_name"></span>
                    <a id="game_detail_link" class="profile-game-detail-link" aria-label="Open game detail">&#8599;</a>
                </h1>
            </div>
            <div class="profile-game-actions">
                <a id="download_all_link" class="pure-button">Download All</a>
                <a id="delete_all_link" class="pure-button btn-danger-subtle">Delete All</a>
            </div>
        </section>
        <div id="version_groups" class="profile-save-version-groups"></div>
        <p id="empty_text" class="muted" style="display:none">No saves for this game family yet.</p>
        <a id="back_link" class="back-link">&#8592; Back to Games</a>
    </div>
</body>
</html>
