<div id="save_row" class="profile-save-row">
    <div class="profile-save-main">
        <span class="profile-save-title-line">
            <span id="save_name" class="profile-save-name"></span>
            <span id="save_date" class="profile-save-date"></span>
        </span>
        <a id="sequence_link" class="muted profile-save-id profile-save-sequence-link">
            <span id="save_count"></span>
        </a>
    </div>
    <div class="profile-save-meta">
        <span id="source_device"></span>
        <span id="file_size"></span>
    </div>
    <div class="profile-save-actions">
        <a id="download_link" class="btn-link">Download Latest</a>
        <a id="delete_link" class="btn-link danger-link">Delete All</a>
    </div>
    <span class="profile-game-arrow" aria-hidden="true">&#8250;</span>
</div>
