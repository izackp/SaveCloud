<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Games — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
    <script src="https://cdn.jsdelivr.net/npm/jdenticon@3.3.0/dist/jdenticon.min.js" async
        integrity="sha384-LfouGM03m83ArVtne1JPk926e3SGD0Tz8XHtW2OKGsgeBU/UfR0Fa8eX+UlwSSAZ"
        crossorigin="anonymous"></script>
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <header class="page-head">
            <h1 id="title"></h1>
        </header>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <section class="profile-detail-hero">
            <div id="profile_avatar_container"></div>
            <div class="profile-detail-copy">
                <p class="profile-detail-kicker" id="profile_id"></p>
                <p class="muted" id="summary_text"></p>
            </div>
        </section>
        <div class="profile-game-controls">
            <form class="profile-game-search pure-form" method="GET">
                <div class="profile-game-search-row">
                    <input id="search_input" type="search" name="q" placeholder="Search game names">
                    <input type="hidden" name="per_page" value="20">
                    <input id="sort_by_input" type="hidden" name="sort_by">
                    <input id="asc_input" type="hidden" name="asc">
                    <button type="submit" class="pure-button">Search</button>
                </div>
            </form>
            <div class="profile-game-sort" aria-label="Sort games">
                <span>Sort</span>
                <a id="sort_name_link" class="profile-game-sort-button">Game name</a>
                <a id="sort_date_link" class="profile-game-sort-button">Last save</a>
            </div>
        </div>
        <section id="game_list" class="profile-game-list" aria-label="Games"></section>
        <p id="empty_text" class="muted" style="display:none">No games found.</p>
        <div class="profile-game-pager">
            <a id="prev_link" style="display:none">&#8592; Previous</a>
            <span id="result_count" class="muted"></span>
            <span id="page_text"></span>
            <a id="next_link" style="display:none">Next &#8594;</a>
        </div>
        <a id="back_link" class="back-link">&#8592; Back to Profiles</a>
    </div>
</body>
</html>
