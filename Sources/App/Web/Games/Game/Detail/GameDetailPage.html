<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Detail — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <header class="page-head">
            <h1>Game Detail</h1>
        </header>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <dl class="record">
            <dt>ID</dt>            <dd><code id="game_id"></code></dd>
            <dt>Name</dt>          <dd><span id="name"></span></dd>
            <dt>Version</dt>       <dd><span id="version"></span></dd>
            <dt>Family ID</dt>     <dd><a id="family_id_link"><code id="family_id"></code></a></dd>
            <dt>Base Game ID</dt>  <dd><code id="base_game_id"></code></dd>
            <dt>Hashed File</dt>   <dd><span id="hashed_file_name"></span></dd>
            <dt>xxHash64</dt>      <dd><code id="xxhash64"></code></dd>
            <dt>Breaks Previous</dt> <dd><span id="breaks_prev"></span></dd>
            <dt>Breaks Base</dt>   <dd><span id="breaks_base"></span></dd>
            <dt>Created</dt>       <dd><span id="created_at"></span></dd>
            <dt>Updated</dt>       <dd><span id="updated_at"></span></dd>
        </dl>
        <a id="back_link" class="back-link">&#8592; Back to Games</a>
    </div>
</body>
</html>
