<form action="/games"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
    <fieldset>
        <legend>Manage Game</legend>

        <label>
            Game ID
            <code id="game_id"></code>
        </label>

        <label for="name">Name</label>
        <input type="text" id="name" name="name" class="pure-input-1" required autofocus autocomplete="off">

        <label for="version">Version</label>
        <input type="text" id="version" name="version" class="pure-input-1" autocomplete="off">

        <label for="family_id">Family ID</label>
        <input type="text" id="family_id" name="family_id" class="pure-input-1" autocomplete="off">

        <label for="base_game_id">Base Game ID</label>
        <input type="text" id="base_game_id" name="base_game_id" class="pure-input-1" autocomplete="off">

        <label for="hashed_file_name">Hashed File Name</label>
        <input type="text" id="hashed_file_name" name="hashed_file_name" class="pure-input-1" autocomplete="off">

        <label for="xxhash64">xxHash64</label>
        <input type="text" id="xxhash64" name="xxhash64" class="pure-input-1" autocomplete="off">

        <label for="breaks_save_format_from_previous_version" class="pure-checkbox">
            <input type="checkbox" id="breaks_save_format_from_previous_version" name="breaks_save_format_from_previous_version">
            Breaks Save Format From Previous Version
        </label>

        <label for="breaks_save_format_from_base_game" class="pure-checkbox">
            <input type="checkbox" id="breaks_save_format_from_base_game" name="breaks_save_format_from_base_game">
            Breaks Save Format From Base Game
        </label>

        <label>
            Created At
            <span id="created_at"></span>
        </label>

        <label>
            Updated At
            <span id="updated_at"></span>
        </label>

        <label id="error_container" class="error-msg" style="display:none">
            <span id="span_error"></span>
        </label>

        <button type="submit" class="pure-button pure-button-primary">Update Game</button>
    </fieldset>
</form>
