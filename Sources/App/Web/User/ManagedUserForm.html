<form action="/user/edit_all/new"
      method="POST"
      enctype="application/x-www-form-urlencoded">
  <fieldset>
    <h2 id="title">Manage User</h2>

    <label for="username">
      Username:
      <input
        type="text"
        id="username"
        name="username"
        required
        autofocus
        autocomplete="off"><br>
    </label>

    <label for="email">
      Email:
      <input
        type="email"
        id="email"
        name="email"
        required><br>
    </label>

    <label for="password">
      Password:
      <input
        type="password"
        id="password"
        name="password"
        class="password-input"><br>
    </label>

    <label for="is_admin">
      <input
        type="checkbox"
        id="is_admin"
        name="is_admin">
      Admin User
    </label>

    <label id="created_container" style="display:none">
      Created At:
      <span id="created_at"></span><br>
    </label>

    <label id="updated_container" style="display:none">
      Updated At:
      <span id="updated_at"></span><br>
    </label>

    <label id="error_container" style="display:none">
      Error:
      <span id="span_error"></span><br>
    </label>

    <button id="submit_button" type="submit">Save</button>
  </fieldset>
</form>
