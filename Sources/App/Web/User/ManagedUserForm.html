<form action="/user/edit_all/new"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
    <fieldset>
        <legend><span id="title">Manage User</span></legend>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="pure-input-1" required autofocus autocomplete="username">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="pure-input-1" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="pure-input-1 password-input" autocomplete="new-password">

        <label for="is_admin" class="pure-checkbox">
            <input type="checkbox" id="is_admin" name="is_admin">
            Admin User
        </label>

        <label id="created_container" style="display:none">
            Created At
            <span id="created_at"></span>
        </label>

        <label id="updated_container" style="display:none">
            Updated At
            <span id="updated_at"></span>
        </label>

        <label id="error_container" class="error-msg" style="display:none">
            <span id="span_error"></span>
        </label>

        <button id="submit_button" type="submit" class="pure-button pure-button-primary">Save</button>
    </fieldset>
</form>
