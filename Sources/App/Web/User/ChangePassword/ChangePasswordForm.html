<form action="/user/change_password"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
    <fieldset>
        <legend>Change Password</legend>

        <label for="cp_current">Current Password</label>
        <input type="password" id="cp_current" name="password_current" class="pure-input-1 password-input"
               required minlength="8" autocomplete="current-password"
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">

        <label for="cp_new">New Password</label>
        <input type="password" id="cp_new" name="password" class="pure-input-1 password-input"
               required minlength="8" autocomplete="new-password"
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">

        <label for="cp_confirm">Re-enter New Password</label>
        <input type="password" id="cp_confirm" name="password_confirmation" class="pure-input-1 password-input"
               required minlength="8" autocomplete="new-password"
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
               title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">

        <label id="error_container" class="error-msg" style="display:none">
            <span id="span_error"></span>
        </label>

        <button type="submit" class="pure-button pure-button-primary">Update Password</button>
    </fieldset>
</form>
