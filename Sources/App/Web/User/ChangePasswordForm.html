<form action="/user/change_password"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
  <fieldset>
    <legend>Change Password</legend>

    <label>
      Current Password
      <input type="password" name="password_current" class="password-input" required minlength="8"
             pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
             title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
    </label>

    <label>
      New Password
      <input type="password" name="password" class="password-input" required minlength="8"
             pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
             title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
    </label>

    <label>
      Re-enter New Password
      <input type="password" name="password_confirmation" class="password-input" required minlength="8"
             pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
             title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
    </label>

    <label id="error_container" style="display:none; color:#c00;">
      Error
      <span id="span_error" style="display:block;"></span>
    </label>

    <button type="submit" class="pure-button pure-button-primary" style="margin-top:0.75rem;">Submit</button>
  </fieldset>
</form>
