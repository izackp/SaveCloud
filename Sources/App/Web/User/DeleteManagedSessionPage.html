<html>
    <head>
        <title>Delete Session</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div>
            <div id='nav_bar'></div>
            <div class='nav_body'>
                <h1>Delete Session</h1>
                <p>Are you sure you want to delete this session?</p>
                <ul>
                    <li>Session ID: <span id="session_id"></span></li>
                    <li>User ID: <span id="user_id"></span></li>
                    <li>Device: <span id="device_name"></span></li>
                    <li>IP Address: <span id="ip_address"></span></li>
                    <li>Expires At: <span id="expires_at"></span></li>
                </ul>
                <form id="delete_form" action="/sessions" method="POST" enctype="application/x-www-form-urlencoded">
                    <button type="submit">Delete Session</button>
                </form>
                <p>
                    <a id="cancel_link" href="/sessions">Cancel</a>
                </p>
            </div>
        </div>
    </body>
</html>
