<html>
    <head>
        <title>Delete User</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div>
            <div id='nav_bar'></div>
            <div class='nav_body'>
                <h1>Delete User</h1>
                <p>Are you sure you want to delete this user?</p>
                <ul>
                    <li>ID: <span id="user_id"></span></li>
                    <li>Username: <span id="username"></span></li>
                    <li>Email: <span id="email"></span></li>
                    <li>Admin: <span id="is_admin"></span></li>
                </ul>
                <form id="delete_form" action="/user/edit_all" method="POST" enctype="application/x-www-form-urlencoded">
                    <button type="submit">Delete User</button>
                </form>
                <p>
                    <a id="cancel_link" href="/user/edit_all">Cancel</a>
                </p>
            </div>
        </div>
    </body>
</html>
