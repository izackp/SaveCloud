<form action="/user/edit"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
    <fieldset>
        <legend>Edit Profile</legend>

        <label for="eu_username">Username</label>
        <input type="text" id="eu_username" name="username" class="pure-input-1" required autofocus autocomplete="username">

        <label for="eu_email">Email</label>
        <input type="email" id="eu_email" name="email" class="pure-input-1" required autocomplete="email">

        <label id="password_container" style="display:none">
            Password Hash
            <code id="password_hash"></code>
        </label>

        <label>
            Created At
            <span id="created_at"></span>
        </label>

        <label>
            Updated At
            <span id="updated_at"></span>
        </label>

        <label for="eu_password">Current password required to save</label>
        <input type="password" id="eu_password" name="password" class="pure-input-1 password-input" autocomplete="current-password">

        <label id="error_container" class="error-msg" style="display:none">
            <span id="span_error"></span>
        </label>

        <button type="submit" class="pure-button pure-button-primary">Update</button>
    </fieldset>
</form>
