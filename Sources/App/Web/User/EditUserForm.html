<form action="/user/edit"
      method="POST"
      enctype="application/x-www-form-urlencoded">
  <fieldset>
    <h2>Edit User:</h2>

    <label for="username">
      Username:
      <input
        type="text"
        id="username"
        name="username"
        required
        autofocus
        autocomplete="off"><br>
    </label>

    <label for="email">
      Email:
      <input
        type="email"
        id="email"
        name="email"
        required><br>
    </label>

    <label id="password_container" style="display:none">
      Password:
      <span id="password_hash"></span><br>
    </label>

    <label>
      Created At:
      <span id="created_at"></span><br>
    </label>

    <label>
      Updated At:
      <span id="updated_at"></span><br>
    </label>

    <label for="password">
      Password required to update:
      <input
        type="password"
        id="password"
        name="password"
        class="password-input"><br>
    </label>

    <label id="error_container" style="display:none">
      Error:
      <span id="span_error"></span><br>
    </label>

    <button type="submit">Update</button>
  </fieldset>
</form>
