<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Detail — Save Cloud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="nav_bar"></div>
    <div class="nav_body">
        <header class="page-head">
            <h1>Save Detail</h1>
        </header>
        <p id="p_error" class="error-msg" style="display:none"></p>
        <dl class="record">
            <dt>ID</dt>             <dd><code id="save_id"></code></dd>
            <dt>User ID</dt>        <dd><code id="user_id"></code></dd>
            <dt>Profile ID</dt>     <dd><code id="profile_id"></code></dd>
            <dt>Game Meta ID</dt>   <dd><a id="game_meta_id_link"><code id="game_meta_id"></code></a></dd>
            <dt>Game Hash ID</dt>   <dd><code id="game_hash_id"></code></dd>
            <dt>Compatibility ID</dt> <dd><code id="compatibility_id"></code></dd>
            <dt>Sequential ID</dt>  <dd><code id="sequential_id"></code></dd>
            <dt>Name</dt>           <dd><span id="name"></span></dd>
            <dt>URL</dt>            <dd><span id="url"></span></dd>
            <dt>File Size</dt>      <dd><span id="file_size"></span></dd>
            <dt>Source Device</dt>  <dd><span id="source_device"></span></dd>
            <dt>Content Hash</dt>   <dd><code id="content_hash"></code></dd>
            <dt>Notes</dt>          <dd><span id="notes"></span></dd>
            <dt>Date</dt>           <dd><span id="date"></span></dd>
            <dt>Created</dt>        <dd><span id="created_at"></span></dd>
            <dt>Updated</dt>        <dd><span id="updated_at"></span></dd>
        </dl>
        <a id="back_link" class="back-link">&#8592; Back to Saves</a>
    </div>
</body>
</html>
