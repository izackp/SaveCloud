<form action="/sessions"
      method="POST"
      enctype="application/x-www-form-urlencoded"
      class="pure-form pure-form-stacked">
    <fieldset>
        <legend>Edit Session</legend>

        <label>
            Session ID
            <code id="session_id"></code>
        </label>

        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id" class="pure-input-1" required autocomplete="off">

        <label for="refresh_token">Refresh Token</label>
        <input type="text" id="refresh_token" name="refresh_token" class="pure-input-1" autocomplete="off">

        <label for="device_name">Device Name</label>
        <input type="text" id="device_name" name="device_name" class="pure-input-1" autocomplete="off">

        <label for="location">Location</label>
        <input type="text" id="location" name="location" class="pure-input-1" autocomplete="off">

        <label for="ip_address">IP Address</label>
        <input type="text" id="ip_address" name="ip_address" class="pure-input-1" required autocomplete="off">

        <label for="is_admin" class="pure-checkbox">
            <input type="checkbox" id="is_admin" name="is_admin">
            Admin Session
        </label>

        <label for="expires_at">Expires At</label>
        <input type="text" id="expires_at" name="expires_at" class="pure-input-1" required autocomplete="off">

        <label>
            Created At
            <span id="created_at"></span>
        </label>

        <label>
            Updated At
            <span id="updated_at"></span>
        </label>

        <label id="error_container" class="error-msg" style="display:none">
            <span id="span_error"></span>
        </label>

        <button type="submit" class="pure-button pure-button-primary">Update Session</button>
    </fieldset>
</form>
